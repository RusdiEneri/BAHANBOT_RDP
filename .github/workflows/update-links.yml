name: Update Bahan Bot Links
on:
  schedule:
    - cron: '0 0 * * *' # Setiap hari jam 00:00 UTC
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-links.yml"

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Generate Links & README (All in One)
        run: |
          cat > generate.py << 'PYEOF'
          import requests
          import json
          import datetime

          links = {}

          # 1. Node.js
          try:
              node_res = requests.get('https://nodejs.org/dist/index.json').json()
              for node in node_res:
                  if node['lts']:
                      version = node['version']
                      links['NodeJS'] = f"https://nodejs.org/dist/{version}/node-{version}-x64.msi"
                      break
          except Exception as e: print("Error Nodejs:", e)

          # 2. Git for Windows
          try:
              git_res = requests.get('https://api.github.com/repos/git-for-windows/git/releases/latest').json()
              for asset in git_res.get('assets', []):
                  if '64-bit.exe' in asset['name']:
                      links['Git'] = asset['browser_download_url']
                      break
          except Exception as e: print("Error Git:", e)

          # 3. FFmpeg
          try:
              ff_res = requests.get('https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest').json()
              for asset in ff_res.get('assets', []):
                  if 'win64-gpl' in asset['name'] and asset['name'].endswith('.zip'):
                      links['FFmpeg'] = asset['browser_download_url']
                      break
          except Exception as e: print("Error FFmpeg:", e)

          # 4. ImageMagick
          try:
              img_res = requests.get('https://api.github.com/repos/ImageMagick/ImageMagick/releases/latest').json()
              for asset in img_res.get('assets', []):
                  if 'Q16-HDRI-x64-dll.exe' in asset['name']:
                      links['ImageMagick'] = asset['browser_download_url']
                      break
          except Exception as e: print("Error ImageMagick:", e)

          # Simpan links.json
          with open('links.json', 'w', encoding='utf-8') as f:
              json.dump(links, f, indent=4)

          # Generate README.md
          timestamp = datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC")
          num_links = len(links)
          table_rows = ""
          for name, url in links.items():
              table_rows += f"| {name} | [Download Link]({url}) |\n"

          with open('README.md', 'w', encoding='utf-8') as f:
              f.write("# 🤖 BAHAN BOT RDP (Auto Installer)\n\n")
              f.write("Repository ini berisi kumpulan link installer otomatis untuk persiapan *environment* Bot WhatsApp di RDP Windows.\n")
              f.write("Link di sini selalu diperbarui otomatis oleh sistem sehingga kamu selalu mendapat versi software terbaru!\n\n")
              f.write("## 📊 Statistik Repository\n")
              f.write(f"- 🕒 **Terakhir Diupdate:** {timestamp}\n")
              f.write(f"- 📦 **Jumlah Software Dilacak:** {num_links}\n")
              f.write("- ✅ **Status Link:** Aktif & Valid\n\n")
              f.write("### 📦 Daftar Software Otomatis\n")
              f.write("| Software | Link Download |\n")
              f.write("|---|---|\n")
              f.write(table_rows)
              f.write("\n---\n\n")
              f.write("## 🚀 Cara Install di RDP Windows (Sangat Mudah!)\n\n")
              f.write("Kamu tidak perlu lagi download file `.exe` satu-satu. Cukup ikuti 2 langkah ini:\n\n")
              f.write("### Langkah 1: Buka PowerShell sebagai Administrator\n")
              f.write("1. Klik tombol **Start** di Windows.\n")
              f.write("2. Ketik **PowerShell**.\n")
              f.write("3. Klik kanan pada \"Windows PowerShell\" lalu pilih **Run as Administrator**.\n\n")
              f.write("### Langkah 2: Copy & Paste Script Ajaib ini\n")
              f.write("Salin kode di bawah ini, klik kanan di jendela PowerShell, lalu tekan **Enter**:\n\n")
              f.write("```powershell\n")
              f.write("Set-ExecutionPolicy Bypass -Scope Process -Force; iwr -useb https://raw.githubusercontent.com/RusdiEneri/BAHANBOTRDP/main/install-bahan.ps1 | iex\n")
              f.write("```\n\n")
              f.write("### Langkah 3: Tinggal Ngopi ☕\n")
              f.write("Biarkan PowerShell bekerja otomatis mengunduh dan menginstall semuanya secara silent.\n\n")
              f.write("---\n\n")
              f.write("<details>\n")
              f.write("<summary><strong>🛠️ Cara Kerja Repo Ini</strong></summary>\n")
              f.write("<br>\n")
              f.write("- Workflow GitHub Actions mencari URL rilis terbaru setiap hari.\n")
              f.write("- `links.json`: Database URL link terbaru.\n")
              f.write("- `install-bahan.ps1`: Script PowerShell untuk instalasi otomatis di RDP.\n")
              f.write("- README.md ini digenerate secara otomatis oleh GitHub Actions.\n")
              f.write("</details>\n\n")
              f.write("---\n")
              f.write("Made with ❤️ by RusdiEneri | Auto-Generated by GitHub Actions\n")

          print("SUCCESS: Links & README.md generated!")
          PYEOF
          python3 generate.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'RusdiEneri'
          git config --global user.email 'nuruddinrusydiilham@gmail.com'
          git add links.json README.md
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          git commit -m "Update link & Statistik README - $TIMESTAMP [skip ci]" --allow-empty
          git push
